name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:manifests
      - run: node --check hook.js && node --check model.js && node --check state.js && node --check background.js && node --check content.js
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: x-daily-rings
          path: dist/*
